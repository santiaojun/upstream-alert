<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upstream Alert: Aug 26 replay prototype (mock data)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --silt: #EEF0EC;      /* background: river silt */
    --ink: #1F2A33;       /* body text */
    --muted: #5E6B74;
    --glacier: #4D7C99;   /* river not yet reached */
    --debris: #6E3B1F;    /* reached: debris flow */
    --amber: #D9A43A;     /* uncertainty band */
    --line: #C9CFC9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Atkinson Hyperlegible", "Noto Sans Devanagari", system-ui, sans-serif;
    color: var(--ink); background: var(--silt);
    display: grid; grid-template-columns: 1fr 380px; height: 100vh;
  }
  #map { height: 100%; background: #dfe3df; }
  aside { overflow-y: auto; padding: 20px 22px; border-left: 1px solid var(--line); background: var(--silt); }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  .note { font-size: .82rem; color: var(--muted); margin: 0 0 18px; line-height: 1.45; }
  .clock { font-size: 3.4rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock-sub { font-size: .9rem; color: var(--muted); margin: 6px 0 16px; min-height: 1.3em; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  button, select {
    font: inherit; font-size: .9rem; padding: 7px 12px; border: 1px solid var(--ink);
    background: white; color: var(--ink); border-radius: 4px; cursor: pointer;
  }
  button.primary { background: var(--ink); color: white; }
  button:focus-visible, select:focus-visible, input:focus-visible, li:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  input[type=range] { width: 100%; margin: 6px 0 18px; accent-color: var(--debris); }
  .legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 18px; height: 5px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); padding: 12px 0; cursor: pointer; }
  li .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  li .name { font-weight: 700; }
  li .status { font-size: .85rem; font-variant-numeric: tabular-nums; text-align: right; }
  li .alert { font-size: .85rem; margin-top: 6px; color: var(--muted); line-height: 1.45; }
  li[data-state=reached] .status { color: var(--debris); font-weight: 700; }
  li[data-state=possible] .status { color: #8a6312; font-weight: 700; }
  .pulse { width: 18px; height: 18px; border-radius: 50%; background: var(--debris); border: 3px solid white; box-shadow: 0 0 0 0 rgba(110,59,31,.6); }
  .pulse.on { animation: ping 1.4s ease-out infinite; }
  @keyframes ping { to { box-shadow: 0 0 0 22px rgba(110,59,31,0); } }
  @media (prefers-reduced-motion: reduce) { .pulse.on { animation: none; } }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 45vh auto; height: auto; }
    aside { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="map" aria-label="River replay map"></div>
<aside>
  <h1>Upstream Alert: replaying August 26</h1>
  <p class="note">Prototype with mock data only. River coordinates, village locations and speeds are placeholders until the real GeoJSON from ArcGIS replaces them.</p>

  <div class="clock" id="clock">08:32</div>
  <div class="clock-sub" id="clockSub"></div>

  <div class="controls">
    <button class="primary" id="playBtn">Play</button>
    <button id="resetBtn">Reset</button>
    <label for="rate" class="note" style="margin:0">Speed</label>
    <select id="rate">
      <option value="1">1 min per second</option>
      <option value="5" selected>5 min per second</option>
      <option value="15">15 min per second</option>
    </select>
  </div>
  <input type="range" id="scrub" aria-label="Replay time">

  <div class="legend">
    <span style="--c: var(--debris)">Reached (slow estimate)</span>
    <span style="--c: var(--amber)">Possibly reached (fast estimate)</span>
    <span style="--c: var(--glacier)">Not yet reached</span>
  </div>

  <ul id="villages"></ul>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ============================================================
// 1. Data (mock) - replace with the file exported by the data pipeline
//    Coordinates follow GeoJSON order: [lon, lat], WGS84 (EPSG:4326)
// ============================================================
const SCENARIO = {
  event: { time: "08:37", lon: 85.47, lat: 28.36, mag: 5.2, label: "Upstream collapse signal (placeholder location)" },
  // Calibrated speed range (km/h), placeholder. Real values come from the 09:00 and 14:14 observations.
  speed_kmh: { low: 10, high: 25 },
  alert_delay_min: 1, // system delay from signal to alert, placeholder
  river: {
    type: "Feature",
    geometry: { type: "LineString", coordinates: [
      [85.47,28.36],[85.43,28.32],[85.39,28.28],[85.37,28.23],[85.35,28.19],[85.34,28.16],
      [85.30,28.11],[85.25,28.06],[85.21,28.01],[85.18,27.97],[85.15,27.92],[85.13,27.87],[85.12,27.82]
    ]}
  },
  // If dist_km is missing, the frontend estimates it from the nearest vertex; real data should use ArcGIS linear referencing
  villages: [
    { name: "Timure",     lon: 85.39, lat: 28.28 },
    { name: "Syafrubesi", lon: 85.34, lat: 28.16 },
    { name: "Betrawati",  lon: 85.18, lat: 27.97 },
    { name: "Kalikhola (location unverified)", lon: 85.12, lat: 27.82 }
  ]
};

// ============================================================
// 2. Geometry helpers: distance along the line and slicing (replaces turf.js lineSliceAlong)
// ============================================================
function haversineKm([lon1, lat1], [lon2, lat2]) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const coords = SCENARIO.river.geometry.coordinates;
const cum = [0];
for (let i = 1; i < coords.length; i++) cum.push(cum[i-1] + haversineKm(coords[i-1], coords[i]));
const totalKm = cum[cum.length - 1];

// Returns coordinates from the source to d km downstream (Leaflet uses [lat, lon])
function sliceAlong(d) {
  d = Math.max(0, Math.min(d, totalKm));
  const out = [[coords[0][1], coords[0][0]]];
  for (let i = 1; i < coords.length; i++) {
    if (cum[i] <= d) { out.push([coords[i][1], coords[i][0]]); continue; }
    const f = (d - cum[i-1]) / (cum[i] - cum[i-1]);
    const lon = coords[i-1][0] + f * (coords[i][0] - coords[i-1][0]);
    const lat = coords[i-1][1] + f * (coords[i][1] - coords[i-1][1]);
    out.push([lat, lon]);
    break;
  }
  return out;
}

// Without dist_km, roughly estimate from the nearest vertex (prototype only)
SCENARIO.villages.forEach(v => {
  if (v.dist_km == null) {
    let best = 0, bestD = Infinity;
    coords.forEach((c, i) => { const dd = haversineKm(c, [v.lon, v.lat]); if (dd < bestD) { bestD = dd; best = i; } });
    v.dist_km = cum[best];
  }
  // Arrival window (minutes after the event): computed in code, never by the LLM
  v.eta_min = [v.dist_km / SCENARIO.speed_kmh.high * 60, v.dist_km / SCENARIO.speed_kmh.low * 60];
});

// ============================================================
// 3. Map
// ============================================================
const map = L.map("map", { zoomControl: true });
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 16, attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const fullLine = sliceAlong(totalKm);
L.polyline(fullLine, { color: "#4D7C99", weight: 4, opacity: .8 }).addTo(map);
const possibleLine = L.polyline([], { color: "#D9A43A", weight: 7 }).addTo(map);
const reachedLine  = L.polyline([], { color: "#6E3B1F", weight: 7 }).addTo(map);
map.fitBounds(L.polyline(fullLine).getBounds(), { padding: [40, 40] });

const pulseIcon = L.divIcon({ className: "", html: '<div class="pulse" id="pulse"></div>', iconSize: [18, 18] });
L.marker([SCENARIO.event.lat, SCENARIO.event.lon], { icon: pulseIcon })
  .bindTooltip(`${SCENARIO.event.label}，M${SCENARIO.event.mag}`).addTo(map);

const villageMarkers = SCENARIO.villages.map(v =>
  L.circleMarker([v.lat, v.lon], { radius: 8, color: "white", weight: 2, fillColor: "#4D7C99", fillOpacity: 1 })
    .bindTooltip(v.name, { permanent: true, direction: "right", offset: [8, 0] }).addTo(map)
);

// ============================================================
// 4. Side panel
// ============================================================
const list = document.getElementById("villages");
SCENARIO.villages.forEach((v, i) => {
  const li = document.createElement("li");
  li.tabIndex = 0;
  li.innerHTML = `<div class="row"><span class="name">${v.name}</span><span class="status"></span></div>
                  <div class="alert"></div>`;
  const focus = () => map.flyTo([v.lat, v.lon], 12, { duration: .6 });
  li.addEventListener("click", focus);
  li.addEventListener("keydown", e => { if (e.key === "Enter") focus(); });
  list.appendChild(li);
  v.el = li;
});

// Placeholder alert text: the real version comes from the AI layer, with numbers checked by the validator
function mockAlert(v, t) {
  const lo = Math.max(0, Math.round(v.eta_min[0] - t)), hi = Math.round(v.eta_min[1] - t);
  return `[EN] Flood wave from upstream. Expected in about ${lo}–${hi} min. Move to higher ground now.<br>[NE] (Nepali alert: generated by the AI layer)`;
}

// ============================================================
// 5. Timeline and rendering
// ============================================================
const START = -5; // start 5 minutes before the event
const END = Math.ceil(Math.max(...SCENARIO.villages.map(v => v.eta_min[1]))) + 10;
const scrub = document.getElementById("scrub");
scrub.min = START; scrub.max = END; scrub.step = 0.1;

const [eh, em] = SCENARIO.event.time.split(":").map(Number);
function clockText(t) {
  const total = Math.floor(eh * 60 + em + t);
  return `${String(Math.floor(total / 60) % 24).padStart(2, "0")}:${String(((total % 60) + 60) % 60).padStart(2, "0")}`;
}

let t = START, playing = false, last = null;

function render() {
  scrub.value = t;
  document.getElementById("clock").textContent = clockText(t);
  const sub = document.getElementById("clockSub");
  if (t < 0) sub.textContent = "Nepal time (UTC+5:45). No upstream signal yet.";
  else if (t < SCENARIO.alert_delay_min) sub.textContent = `Signal detected ${Math.round(t)} min ago. Generating alerts.`;
  else sub.textContent = `${Math.floor(t)} min after the signal. Alerts sent.`;

  document.getElementById("pulse")?.classList.toggle("on", t >= 0);

  const tt = Math.max(0, t);
  const slowKm = SCENARIO.speed_kmh.low * tt / 60;
  const fastKm = SCENARIO.speed_kmh.high * tt / 60;
  reachedLine.setLatLngs(t >= 0 ? sliceAlong(slowKm) : []);
  possibleLine.setLatLngs(t >= 0 ? sliceAlong(fastKm) : []);

  SCENARIO.villages.forEach((v, i) => {
    let state, status, alert = "";
    if (t < SCENARIO.alert_delay_min) { state = "idle"; status = t < 0 ? "Normal" : "Generating alert"; }
    else if (v.dist_km <= slowKm) { state = "reached"; status = "Reached"; }
    else if (v.dist_km <= fastKm) { state = "possible"; status = "Possibly reached"; alert = mockAlert(v, t); }
    else {
      state = "warning";
      status = `${Math.round(v.eta_min[0] - t)}–${Math.round(v.eta_min[1] - t)} min`;
      alert = mockAlert(v, t);
    }
    v.el.dataset.state = state;
    v.el.querySelector(".status").textContent = status;
    v.el.querySelector(".alert").innerHTML = alert;
    villageMarkers[i].setStyle({ fillColor: state === "reached" ? "#6E3B1F" : state === "possible" ? "#D9A43A" : "#4D7C99" });
  });
}

function loop(ts) {
  if (!playing) return;
  if (last != null) t += (ts - last) / 1000 * Number(document.getElementById("rate").value);
  last = ts;
  if (t >= END) { t = END; setPlaying(false); }
  render();
  requestAnimationFrame(loop);
}
function setPlaying(p) {
  playing = p; last = null;
  document.getElementById("playBtn").textContent = p ? "Pause" : "Play";
  if (p) requestAnimationFrame(loop);
}
document.getElementById("playBtn").onclick = () => { if (t >= END) t = START; setPlaying(!playing); };
document.getElementById("resetBtn").onclick = () => { setPlaying(false); t = START; render(); };
scrub.oninput = () => { t = Number(scrub.value); render(); };

render();
</script>
</body>
</html>
